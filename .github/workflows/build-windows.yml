name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name StockScope --collect-all matplotlib app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Download Chinese language pack
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/main/ChineseSimplified.isl" -OutFile "ChineseSimplified.isl"
        
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: StockScope-Windows-Installer
          path: installer-output/StockScope-Setup.exe
